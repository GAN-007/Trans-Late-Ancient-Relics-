name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Compile Python
        run: python -m compileall -q app cli.py
      - name: Test
        env:
          ESHB_RUNTIME_DIR: ${{ runner.temp }}/eshb-runtime
          ESHB_AI_PROVIDER: disabled
          ESHB_VISION_BACKEND: auto
          ESHB_ACTIVE_LEARNING_STORE_IMAGES: "false"
        run: python -m pytest -q
      - name: Import API and verify version
        env:
          ESHB_RUNTIME_DIR: ${{ runner.temp }}/eshb-runtime
          ESHB_AI_PROVIDER: disabled
        run: python -c "from app.main import app; assert app.version == '3.0.0'"
      - name: Smoke-test epigraphy modules without optional vision dependencies
        env:
          ESHB_RUNTIME_DIR: ${{ runner.temp }}/eshb-runtime
        run: python -c "from app.epigraphy import analyze_hieroglyphic_text; from app.morphology import analyze_transliteration; assert analyze_hieroglyphic_text('𓄤')['sign_count']==1; assert analyze_transliteration('sḏm.n.f')['words'][0]['form_candidates']"
      - name: Check browser JavaScript syntax
        run: |
          for file in app/static/js/*.js app/static/service-worker.js; do
            node --check "$file"
          done

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: trans-late-ancient-relics:v3-ci
