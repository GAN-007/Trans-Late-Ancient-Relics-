name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Compile Python
        run: python -m compileall -q app cli.py
      - name: Test
        env:
          ESHB_RUNTIME_DIR: ${{ runner.temp }}/eshb-runtime
          ESHB_AI_PROVIDER: disabled
        run: python -m pytest -q
      - name: Import API
        env:
          ESHB_RUNTIME_DIR: ${{ runner.temp }}/eshb-runtime
          ESHB_AI_PROVIDER: disabled
        run: python -c "from app.main import app; assert app.version == '2.0.0'"
      - name: Check browser JavaScript syntax
        run: |
          for file in app/static/js/*.js app/static/service-worker.js; do
            node --check "$file"
          done

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: trans-late-ancient-relics:ci
