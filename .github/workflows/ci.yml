name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Compile Python
        run: python -m compileall -q app cli.py scripts
      - name: Test
        env:
          ESHB_RUNTIME_DIR: ${{ runner.temp }}/eshb-runtime
          ESHB_AI_PROVIDER: disabled
          ESHB_VISION_BACKEND: auto
          ESHB_ACTIVE_LEARNING_STORE_IMAGES: "false"
        run: python -m pytest -q
      - name: Import API and verify version
        env:
          ESHB_RUNTIME_DIR: ${{ runner.temp }}/eshb-runtime
          ESHB_AI_PROVIDER: disabled
        run: python -c "from app.main import app; assert app.version == '3.0.0'"
      - name: Smoke-test epigraphy modules without optional vision dependencies
        env:
          ESHB_RUNTIME_DIR: ${{ runner.temp }}/eshb-runtime
        run: python -c "from app.epigraphy import analyze_hieroglyphic_text; from app.morphology import analyze_transliteration; assert analyze_hieroglyphic_text('𓄤')['sign_count']==1; assert analyze_transliteration('sḏm.n.f')['words'][0]['form_candidates']"
      - name: Check browser JavaScript syntax
        run: |
          for file in app/static/js/*.js app/static/service-worker.js; do
            node --check "$file"
          done

  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: eshb
          POSTGRES_PASSWORD: eshb
          POSTGRES_DB: eshb
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U eshb" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies (PostgreSQL, object storage, vision evaluation)
        run: python -m pip install --upgrade pip && pip install -r requirements-postgres.txt onnxruntime numpy pillow
      - name: Test suite on PostgreSQL (one schema per test)
        env:
          ESHB_DATABASE_URL: postgresql://eshb:eshb@localhost:5432/eshb
          ESHB_RUNTIME_DIR: ${{ runner.temp }}/eshb-runtime
          ESHB_AI_PROVIDER: disabled
          ESHB_VISION_BACKEND: auto
          ESHB_ACTIVE_LEARNING_STORE_IMAGES: "false"
        run: python -m pytest -q
      - name: Migrations, corpus import audit and audit-chain check via the CLI
        env:
          ESHB_DATABASE_URL: postgresql://eshb:eshb@localhost:5432/eshb
          ESHB_RUNTIME_DIR: ${{ runner.temp }}/eshb-runtime
        run: |
          python cli.py migrate
          python cli.py corpus import-tla app/data/corpus/tla_samples --source-id tla-ci
          python cli.py audit verify | python -c "import json,sys; assert json.load(sys.stdin)['ok']"
      - name: Translation benchmark does not regress below the recorded baseline
        env:
          ESHB_RUNTIME_DIR: ${{ runner.temp }}/eshb-runtime
        run: python -m pytest -q tests/test_research_layers.py -k baseline

  docker:
    runs-on: ubuntu-latest
    needs: [test, postgres]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: trans-late-ancient-relics:v3-ci
