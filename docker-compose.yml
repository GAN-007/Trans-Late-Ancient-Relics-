services:
  relics:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - relics_data:/app/data-runtime
    environment:
      ESHB_ENV: ${ESHB_ENV:-development}
      ESHB_RUNTIME_DIR: /app/data-runtime
      ESHB_SECURE_COOKIES: ${ESHB_SECURE_COOKIES:-false}
      ESHB_ALLOWED_ORIGINS: ${ESHB_ALLOWED_ORIGINS:-}
      ESHB_ALLOWED_WS_ORIGINS: ${ESHB_ALLOWED_WS_ORIGINS:-}
      ESHB_AI_PROVIDER: ${ESHB_AI_PROVIDER:-openai}
      ESHB_AI_MODEL: ${ESHB_AI_MODEL:-gpt-5.6}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ESHB_VISION_BACKEND: ${ESHB_VISION_BACKEND:-auto}
      ESHB_VISION_MODEL_PATH: ${ESHB_VISION_MODEL_PATH:-/app/models/relic_detector.onnx}
      ESHB_VISION_CLASSES_PATH: ${ESHB_VISION_CLASSES_PATH:-/app/models/classes.json}
      ESHB_VISION_CONFIDENCE: ${ESHB_VISION_CONFIDENCE:-0.45}
      ESHB_VISION_NMS_IOU: ${ESHB_VISION_NMS_IOU:-0.45}
      ESHB_ACTIVE_LEARNING_ENABLED: ${ESHB_ACTIVE_LEARNING_ENABLED:-true}
      ESHB_ACTIVE_LEARNING_STORE_IMAGES: ${ESHB_ACTIVE_LEARNING_STORE_IMAGES:-false}
      ESHB_KNOWLEDGE_LOOP_ENABLED: ${ESHB_KNOWLEDGE_LOOP_ENABLED:-false}
      ESHB_KNOWLEDGE_LOOP_HOURS: ${ESHB_KNOWLEDGE_LOOP_HOURS:-24}
      ESHB_KNOWLEDGE_LOOP_BATCH: ${ESHB_KNOWLEDGE_LOOP_BATCH:-5}
      ESHB_BOOTSTRAP_ADMIN_USERNAME: ${ESHB_BOOTSTRAP_ADMIN_USERNAME:-}
      ESHB_BOOTSTRAP_ADMIN_PASSWORD: ${ESHB_BOOTSTRAP_ADMIN_PASSWORD:-}
    restart: unless-stopped

volumes:
  relics_data:
