[project]
name = "eshb-ancient-egyptian-tutor"
version = "1.0.0"
description = "Reversible English/Swahili/IPA ESHB bridge plus Middle Egyptian teaching, dictionary, transliteration and guarded translation."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "pydantic>=2.7,<3.0"
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
