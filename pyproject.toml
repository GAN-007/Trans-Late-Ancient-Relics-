[project]
name = "trans-late-ancient-relics"
version = "2.0.0"
description = "Live, context-aware Ancient Egyptian learning and translation with ESHB, English, Swahili, IPA, camera, voice and review-gated AI."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "pydantic>=2.7,<3.0",
  "httpx>=0.28,<1.0",
  "email-validator>=2.2,<3.0"
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
