[project]
name = "trans-late-ancient-relics"
version = "2.0.0"
description = "Ancient Egyptian learning, contextual translation, live camera analysis, voice access and reversible ESHB tools."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "pydantic>=2.7,<3.0",
  "httpx>=0.27,<1.0"
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
